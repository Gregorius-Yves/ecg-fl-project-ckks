---
# ==============================================================================
# PLAYBOOK: Hentikan Seluruh FL Client di VM Klien (VM 2, 3, 4)
# Cukup jalankan dari VM Server:
#   ansible-playbook -i inventory.ini stop_clients.yml
# ==============================================================================

- name: Hentikan Flower Client di Seluruh Node Klien
  hosts: clients
  become: true
  tasks:
    - name: 1. Hentikan proses python3 src/client.py
      ansible.builtin.shell: |
        for pid in $(pgrep -f "[c]lient.py"); do
          if [ "$pid" != "$$" ]; then
            kill -9 "$pid" 2>/dev/null || true
          fi
        done
        true
      args:
        executable: /bin/bash
      failed_when: false

    - name: 2. Hentikan container Docker jika ada
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true
      ignore_errors: true

    - name: 3. Hapus file log klien lama secara bersih
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/ecg-fl-project/logs/client.log"
        state: absent

    - name: 4. Konfirmasi proses telah berhenti
      ansible.builtin.shell: |
        pgrep -f "[c]lient.py" || echo "STOPPED"
      args:
        executable: /bin/bash
      register: stop_status
      changed_when: false

    - name: 5. Status
      ansible.builtin.debug:
        msg: "🛑 [{{ inventory_hostname }}] Client {{ dataset_label }} telah dihentikan & log dibersihkan (Status: {{ stop_status.stdout | trim }})."
