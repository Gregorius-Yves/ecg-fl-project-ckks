---
# ==============================================================================
# PLAYBOOK: Hentikan Seluruh Container Docker FL Client di Worker Node (VM 2, 3, 4)
# Penggunaan:
#   ansible-playbook -i inventory.ini stop_clients.yml
# ==============================================================================

- name: Hentikan Flower Client Containers di Seluruh Node Klien
  hosts: clients
  become: true
  tasks:
    - name: 1. Hentikan dan hapus container Docker client
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true
      ignore_errors: true

    - name: 2. Hentikan sisa proses python jika ada di host
      ansible.builtin.shell: |
        pkill -9 -f "src.client" || true
      args:
        executable: /bin/bash
      changed_when: false
      ignore_errors: true

    - name: 3. Konfirmasi container Docker telah nonaktif
      ansible.builtin.command: "docker ps -a --filter name={{ container_name }} --format '{{ '{{' }}.Names{{ '}}' }}: {{ '{{' }}.Status{{ '}}' }}'"
      register: check_stopped
      changed_when: false

    - name: 4. Status Penghentian
      ansible.builtin.debug:
        msg: "🛑 [{{ inventory_hostname }}] Container '{{ container_name }}' ({{ dataset_label }}) berhasil dihentikan."
