---
# ==============================================================================
# PLAYBOOK: Pengelolaan Cluster FL (Status, Stop, Logs, Fetch Checkpoints)
# Penggunaan:
#   ansible-playbook -i inventory.ini manage_fl.yml -e "action=status"
#   ansible-playbook -i inventory.ini manage_fl.yml -e "action=stop"
#   ansible-playbook -i inventory.ini manage_fl.yml -e "action=fetch_results"
# ==============================================================================

- name: Operasi Manajemen Cluster FL
  hosts: fl_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Set default aksi jika tidak didefinisikan
      ansible.builtin.set_fact:
        target_action: "{{ action | default('status') }}"

    # -------------------------------------------------------------
    # ACTION: STATUS
    # -------------------------------------------------------------
    - name: [Status] Cek status Docker containers di host
      ansible.builtin.command: docker ps -a --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_status_output
      when: target_action == 'status'
      changed_when: false

    - name: [Status] Tampilkan status container
      ansible.builtin.debug:
        msg: |
          === NODE: {{ inventory_hostname }} ({{ ansible_host }}) ===
          {{ container_status_output.stdout }}
      when: target_action == 'status'

    # -------------------------------------------------------------
    # ACTION: STOP
    # -------------------------------------------------------------
    - name: [Stop] Hentikan semua container FL di server
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop:
        - fl-server
      when: target_action == 'stop' and 'server' in group_names
      ignore_errors: true

    - name: [Stop] Hentikan container FL di client
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true
      when: target_action == 'stop' and 'clients' in group_names
      ignore_errors: true

    - name: [Stop] Konfirmasi penghentian selesai
      ansible.builtin.debug:
        msg: "Container pada node {{ inventory_hostname }} berhasil dihentikan."
      when: target_action == 'stop'

    # -------------------------------------------------------------
    # ACTION: RESTART DASHBOARD
    # -------------------------------------------------------------
    - name: [Restart Dashboard] Restart container Streamlit Dashboard
      community.docker.docker_container:
        name: fl-dashboard
        state: started
        restart: true
      when: target_action == 'restart_dashboard' and 'server' in group_names


- name: [Fetch Results] Download Hasil Checkpoints & Logs dari VM 1 ke Local Dev
  hosts: server
  become: true
  gather_facts: false
  tasks:
    - name: Sinkronkan checkpoint dan logs hasil eksperimen ke laptop lokal
      ansible.posix.synchronize:
        mode: pull
        src: "{{ checkpoints_dir_remote }}/"
        dest: "{{ playbook_dir }}/../results/checkpoints/"
      when: action | default('') == 'fetch_results'

    - name: Sinkronkan log eksperimen ke laptop lokal
      ansible.posix.synchronize:
        mode: pull
        src: "{{ logs_dir_remote }}/"
        dest: "{{ playbook_dir }}/../results/logs/"
      when: action | default('') == 'fetch_results'
