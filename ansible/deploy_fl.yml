---
# ==============================================================================
# PLAYBOOK: Deploy & Run FL Server, Dashboard, dan Clients (Flower + Docker)
# ==============================================================================

- name: "[1/3] Persiapan Direktori & Sinkronisasi Kode di Seluruh Node"
  hosts: fl_cluster
  become: true
  tasks:
    - name: Cek apakah direktori proyek sudah merupakan repositori Git
      ansible.builtin.stat:
        path: "{{ project_root_remote }}/.git"
      register: git_repo_stat

    - name: Bersihkan folder yang belum menjadi git repo agar clone berhasil
      ansible.builtin.file:
        path: "{{ project_root_remote }}"
        state: absent
      when: use_git_clone | bool and not git_repo_stat.stat.exists

    - name: Clone atau pull kode terbaru dari Git repository (jika use_git_clone=true)
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ project_root_remote }}"
        version: "{{ git_branch }}"
        force: true
      when: use_git_clone | bool

    - name: Buat direktori kerja proyek, results permanen, dan logging di remote node
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0775"
      loop:
        - "{{ project_root_remote }}"
        - "{{ results_dir_remote }}"
        - "{{ logs_dir_remote }}"

    - name: Sinkronisasi kode lokal ke remote VM menggunakan rsync (jika use_git_clone=false)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_root_remote }}/"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.pytest_cache"
          - "--exclude=.venv"
          - "--exclude=venv"
          - "--exclude=data/*"
          - "--exclude=results/*"
          - "--exclude=logs/*"
      when: not (use_git_clone | bool)


# ------------------------------------------------------------------------------
# DEPLOYMENT VM 1: DASHBOARD + FL SERVER (satu container; server dijalankan dari dashboard)
# ------------------------------------------------------------------------------
- name: "[2/3] Build & Jalankan Dashboard + FL Server di VM 1"
  hosts: server
  become: true
  tasks:
    - name: Build Docker image (Dockerfile & requirements.txt dari repo)
      community.docker.docker_image:
        name: "{{ fl_image_name }}"
        build:
          path: "{{ project_root_remote }}"
          dockerfile: Dockerfile
        source: build
        force_source: true

    - name: Hentikan dan bersihkan container lama (hasil di volume results TIDAK terhapus)
      community.docker.docker_container:
        name: fl-dashboard
        state: absent
        force_kill: true

    - name: Pastikan port 8080 dan 8501 di host bebas dari proses native lama
      ansible.builtin.shell: |
        fuser -k 8080/tcp 2>/dev/null || true
        fuser -k 8501/tcp 2>/dev/null || true
        pkill -9 -f "src.server" 2>/dev/null || true
        pkill -9 -f "src.ui.server" 2>/dev/null || true
        sleep 1
      args:
        executable: /bin/bash
      changed_when: false
      ignore_errors: true

    - name: Jalankan container Dashboard + Flower Server
      community.docker.docker_container:
        name: fl-dashboard
        image: "{{ fl_image_name }}"
        command: ["python", "-m", "src.ui.server"]
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ fl_dashboard_port }}:8501"
          - "{{ fl_server_port }}:8080"
        volumes:
          - "{{ results_dir_remote }}:/app/results"
          - "{{ logs_dir_remote }}:/app/logs"
        env:
          HOST: "0.0.0.0"
          PORT: "8501"
          RESULTS_DIR: "/app/results"

    - name: Tunggu Dashboard siap (Port 8501)
      ansible.builtin.wait_for:
        host: "{{ fl_server_ip }}"
        port: "{{ fl_dashboard_port }}"
        state: started
        delay: 3
        timeout: 90


# ------------------------------------------------------------------------------
# DEPLOYMENT VM 2, 3, 4: FL CLIENTS (PTB-XL, CHAPMAN, G12EC)
# ------------------------------------------------------------------------------
- name: "[3/3] Build & Jalankan FL Client di Seluruh Node Worker"
  hosts: clients
  become: true
  tasks:
    - name: Buat direktori data lokal untuk client jika belum ada
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0775"

    - name: Build Docker image client (image yang sama dengan server)
      community.docker.docker_image:
        name: "{{ fl_image_name }}"
        build:
          path: "{{ project_root_remote }}"
          dockerfile: Dockerfile
        source: build
        force_source: true

    - name: Hentikan container client lama (jika berjalan)
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true

    - name: Jalankan Container FL Client ({{ dataset_label }})
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ fl_image_name }}"
        command: ["python", "-m", "src.client"]
        state: started
        restart_policy: unless-stopped
        shm_size: "2gb"
        volumes:
          - "{{ data_dir }}:/app/data/{{ dataset_name }}:ro"
          - "{{ logs_dir_remote }}:/app/logs"
        env:
          SERVER_ADDRESS: "{{ server_address }}"
          CLIENT_ID: "{{ client_id | string }}"
          DATASET_NAME: "{{ dataset_name }}"
          DATA_DIR: "/app/data/{{ dataset_name }}"
          STRATEGY: "auto"      # strategi dikendalikan server
          BATCH_SIZE: "{{ fl_batch_size | string }}"
          LOCAL_EPOCHS: "{{ fl_local_epochs | string }}"
          LEARNING_RATE: "{{ fl_learning_rate | string }}"

    - name: Konfirmasi status container client
      ansible.builtin.command: "docker ps --filter name={{ container_name }} --format '{{ '{{' }}.Names{{ '}}' }}: {{ '{{' }}.Status{{ '}}' }}'"
      register: client_status
      changed_when: false

    - name: Log status client
      ansible.builtin.debug:
        msg: "Client Node {{ inventory_hostname }} ({{ dataset_label }}) -> {{ client_status.stdout }}"
