---
# ==============================================================================
# PLAYBOOK: Pra-Pemrosesan Offline Paralel Berbasis Docker di VM Klien EKG
# Menjalankan pembersihan sinyal di dalam Docker Container terisolasi
# Penggunaan:
#   ansible-playbook -i inventory.ini preprocess_data.yml
# ==============================================================================

- name: Pra-pemrosesan Sinyal EKG ke File Tensor Bersih via Docker
  hosts: clients
  become: true
  tasks:
    - name: 1. Periksa ketersediaan file tensor .pt di {{ data_dir }}
      ansible.builtin.stat:
        path: "{{ data_dir }}/{{ dataset_name }}_preprocessed.pt"
      register: pt_stat

    - name: 2. Pastikan Docker Image {{ fl_image_name }} tersedia
      community.docker.docker_image:
        name: "{{ fl_image_name }}"
        build:
          path: "{{ project_root_remote }}"
          dockerfile: Dockerfile
        source: build
        force_source: false
      when: not pt_stat.stat.exists or (force | default(false) | bool)

    - name: 3. Jalankan pembersihan sinyal EKG di dalam Container Docker (Ephemeral)
      community.docker.docker_container:
        name: "fl-prep-{{ dataset_name }}"
        image: "{{ fl_image_name }}"
        command: >
          python preprocess_data.py
          --dataset {{ dataset_name }}
          --data_dir /data
          --output /data/{{ dataset_name }}_preprocessed.pt
        state: started
        restart: false
        cleanup: true
        detach: false
        volumes:
          - "{{ data_dir }}:/data:rw"
      when: not pt_stat.stat.exists or (force | default(false) | bool)
      register: prep_container_run

    - name: 4. Set izin kepemilikan file tensor .pt di host
      ansible.builtin.file:
        path: "{{ data_dir }}/{{ dataset_name }}_preprocessed.pt"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0664"
      ignore_errors: true

    - name: 5. Verifikasi ukuran file tensor yang siap dimuat ke RAM
      ansible.builtin.shell: "ls -lh {{ data_dir }}/{{ dataset_name }}_preprocessed.pt | awk '{print $5}'"
      register: file_size
      changed_when: false

    - name: 6. Laporan Status Tensor Bersih
      ansible.builtin.debug:
        msg: "🚀 [{{ inventory_hostname }}] Dataset '{{ dataset_label }}' siap dimuat langsung ke RAM 8GB! Ukuran tensor: {{ file_size.stdout | trim }}"
