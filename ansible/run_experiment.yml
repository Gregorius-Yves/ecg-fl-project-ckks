---
# ==============================================================================
# PLAYBOOK: Orkestrasi Eksperimen FL Berbasis Docker
# Mengirim instruksi ke Container fl-dashboard atau menjalankan container server FL
# Setiap eksperimen menghasilkan run baru di results/runs/<strategi>-<waktu>/ (append-only)
#
# Penggunaan:
#   ansible-playbook -i inventory.ini run_experiment.yml -e "strategy=fedavg rounds=50"
#   ansible-playbook -i inventory.ini run_experiment.yml -e "strategy=fedprox rounds=50 proximal_mu=0.01"
#   ansible-playbook -i inventory.ini run_experiment.yml -e "strategy=scaffold rounds=50"
#   ansible-playbook -i inventory.ini run_experiment.yml -e "strategy=fedbb rounds=50 fedbb_alpha=0.5"
# ==============================================================================

- name: "[1/3] Validasi Parameter & Konfigurasi Modular"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Parse parameter
      ansible.builtin.set_fact:
        current_strategies: "{{ (strategy | default(fl_strategy) | lower).split(',') | map('trim') | list }}"
        current_rounds: "{{ rounds | default(fl_num_rounds) | int }}"
        current_prox_mu: "{{ proximal_mu | default(0.01) | float }}"
        current_bb_alpha: "{{ fedbb_alpha | default(0.5) | float }}"
        current_sol_mu: "{{ fedsol_mu | default(0.01) | float }}"

    - name: Validasi nama strategi
      ansible.builtin.assert:
        that:
          - item in ['fedavg', 'fedprox', 'scaffold', 'fedbn', 'fedbb', 'fedsol', 'all']
        fail_msg: "Strategi '{{ item }}' tidak valid! Pilih: fedavg, fedprox, scaffold, fedbn, fedbb, fedsol, all."
      loop: "{{ current_strategies }}"


- name: "[2/3] Pastikan Container Docker Klien Berjalan"
  hosts: clients
  become: true
  tasks:
    - name: Cek status container client
      ansible.builtin.command: "docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ container_name }}"
      register: client_inspect
      failed_when: false
      changed_when: false

    - name: Nyalakan container client jika belum berjalan
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ fl_image_name }}"
        command: ["python", "-m", "src.client"]
        state: started
        restart_policy: unless-stopped
        shm_size: "2gb"
        network_mode: "host"
        volumes:
          - "{{ data_dir }}:/app/data/{{ dataset_name }}:ro"
          - "{{ project_root_remote }}/logs:/app/logs"
        env:
          SERVER_ADDRESS: "{{ fl_server_ip }}:{{ fl_server_port }}"
          CLIENT_ID: "{{ client_id | string }}"
          DATASET_NAME: "{{ dataset_name }}"
          DATA_DIR: "/app/data/{{ dataset_name }}"
          STRATEGY: "auto"
          BATCH_SIZE: "{{ fl_batch_size | string }}"
          LOCAL_EPOCHS: "{{ fl_local_epochs | string }}"
          LEARNING_RATE: "{{ fl_learning_rate | string }}"
      when: client_inspect.rc != 0 or client_inspect.stdout | trim != 'true'


- name: "[3/3] Mulai Eksperimen Melalui Container Dashboard Server"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: POST /api/experiment/start ke Container Dashboard
      ansible.builtin.uri:
        url: "http://{{ fl_server_ip }}:{{ fl_dashboard_port }}/api/experiment/start"
        method: POST
        body_format: json
        body:
          strategy: "{{ current_strategies if current_strategies | length > 1 else current_strategies[0] }}"
          num_rounds: "{{ current_rounds | int }}"
          local_epochs: "{{ fl_local_epochs | int }}"
          learning_rate: "{{ fl_learning_rate | float }}"
          batch_size: "{{ fl_batch_size | int }}"
          proximal_mu: "{{ current_prox_mu }}"
          fedbb_alpha: "{{ current_bb_alpha }}"
          fedsol_mu: "{{ current_sol_mu }}"
        status_code: 200
      register: start_result

    - name: Konfirmasi Eksekusi Eksperimen
      ansible.builtin.debug:
        msg:
          - "🚀 Eksperimen FL dimulai di container Docker Server!"
          - "Strategi: {{ current_strategies }}"
          - "Ronde: {{ current_rounds }}"
          - "Parameter Modular: proximal_mu={{ current_prox_mu }}, fedbb_alpha={{ current_bb_alpha }}, fedsol_mu={{ current_sol_mu }}"
          - "Pantau kemajuan real-time di Dashboard: http://{{ fl_server_ip }}:{{ fl_dashboard_port }}"
