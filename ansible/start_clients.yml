---
# ==============================================================================
# PLAYBOOK: Jalankan FL Client Native Python di Seluruh VM Klien (VM 2, 3, 4)
# Menjalankan src/client.py di latar belakang (background) tanpa Docker
# Cukup jalankan dari VM Server:
#   ansible-playbook -i inventory.ini start_clients.yml
# ==============================================================================

- name: Mulai Flower Client di Seluruh Node Klien (Native Python)
  hosts: clients
  become: false
  vars:
    user_project_dir: "/home/{{ ansible_user }}/ecg-fl-project"
    server_addr: "{{ fl_server_ip | default('10.34.100.114') }}:{{ fl_server_port | default(8080) }}"
    batch_sz: "{{ fl_batch_size | default(128) }}"
  tasks:
    - name: 1. Tarik pembaruan kode terbaru dari Git secara presisi
      ansible.builtin.shell: |
        git config --global --add safe.directory "{{ user_project_dir }}"
        git fetch origin main
        git reset --hard origin/main
      args:
        chdir: "{{ user_project_dir }}"

    - name: 2. Hentikan instance client lama jika sedang berjalan
      ansible.builtin.shell: |
        for pid in $(pgrep -f "[c]lient.py"); do
          if [ "$pid" != "$$" ]; then
            kill -9 "$pid" 2>/dev/null || true
          fi
        done
        true
      args:
        executable: /bin/bash
      failed_when: false

    - name: 3. Hapus log lama secara bersih
      ansible.builtin.shell: |
        mkdir -p "{{ user_project_dir }}/logs"
        rm -f "{{ user_project_dir }}/logs/client.log"
      args:
        executable: /bin/bash

    - name: 4. Jalankan Flower Client di background (nohup)
      ansible.builtin.shell: |
        if [ -d "venv" ]; then source venv/bin/activate; fi
        nohup python3 src/client.py \
          --server {{ server_addr }} \
          --client_id {{ client_id }} \
          --dataset {{ dataset_name }} \
          --batch_size {{ batch_sz }} \
          > logs/client.log 2>&1 &
      args:
        chdir: "{{ user_project_dir }}"
        executable: /bin/bash

    - name: 5. Tunggu inisialisasi dan baca status awal
      ansible.builtin.shell: |
        sleep 3
        pgrep -f "[c]lient.py" | head -n 1
      args:
        executable: /bin/bash
      register: client_pid
      changed_when: false

    - name: 5b. Ambil log awal eksekusi klien
      ansible.builtin.shell: "tail -n 10 {{ user_project_dir }}/logs/client.log"
      register: startup_log
      changed_when: false

    - name: 6. Tampilkan Konfirmasi Status Klien
      ansible.builtin.debug:
        msg:
          - "🟢 [{{ inventory_hostname }}] Client '{{ dataset_label }}' (ID: {{ client_id }}) AKTIF (PID: {{ client_pid.stdout | trim }})"
          - "📄 Log Awal:"
          - "{{ startup_log.stdout_lines }}"
