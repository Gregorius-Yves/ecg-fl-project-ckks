---
# ==============================================================================
# PLAYBOOK: Orkestrasi Mulai FL Client Berbasis Docker di VM Klien (VM 2, 3, 4)
# Menggunakan Docker Container terisolasi dengan Resource Allocation & ShmSize
# Penggunaan:
#   ansible-playbook -i inventory.ini start_clients.yml
# ==============================================================================

- name: Start Flower Client Containers di Seluruh Worker Node
  hosts: clients
  become: true
  tasks:
    - name: 1. Pastikan direktori logs dan data tersedia di host
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0775"
      loop:
        - "{{ project_root_remote }}/logs"
        - "{{ data_dir }}"

    - name: 2. Tarik kode terbaru dari Git (jika use_git_clone=true)
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ project_root_remote }}"
        version: "{{ git_branch }}"
        force: true
      when: use_git_clone | default(true) | bool

    - name: 3. Pastikan Docker Image {{ fl_image_name }} siap di Worker Node
      community.docker.docker_image:
        name: "{{ fl_image_name }}"
        build:
          path: "{{ project_root_remote }}"
          dockerfile: Dockerfile
        source: build
        force_source: false

    - name: 4. Hentikan container client lama jika sedang berjalan
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true

    - name: 5. Jalankan Container FL Client ({{ dataset_label }})
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ fl_image_name }}"
        command: ["python", "-m", "src.client"]
        state: started
        restart_policy: unless-stopped
        shm_size: "2G"
        network_mode: "host"
        volumes:
          - "{{ data_dir }}:/app/data/{{ dataset_name }}:ro"
          - "{{ project_root_remote }}/logs:/app/logs"
        env:
          SERVER_ADDRESS: "{{ fl_server_ip }}:{{ fl_server_port }}"
          CLIENT_ID: "{{ client_id | string }}"
          DATASET_NAME: "{{ dataset_name }}"
          DATA_DIR: "/app/data/{{ dataset_name }}"
          STRATEGY: "auto"
          BATCH_SIZE: "{{ fl_batch_size | string }}"
          LOCAL_EPOCHS: "{{ fl_local_epochs | string }}"
          LEARNING_RATE: "{{ fl_learning_rate | string }}"

    - name: 6. Tunggu inisialisasi container client
      ansible.builtin.pause:
        seconds: 2

    - name: 7. Ambil status container client dari Docker engine
      ansible.builtin.command: "docker ps --filter name={{ container_name }} --format '{{ '{{' }}.Names{{ '}}' }}: {{ '{{' }}.Status{{ '}}' }} (Image: {{ '{{' }}.Image{{ '}}' }})'"
      register: docker_client_status
      changed_when: false

    - name: 8. Ambil 5 baris log pertama container client
      ansible.builtin.command: "docker logs --tail 5 {{ container_name }}"
      register: docker_client_log
      changed_when: false
      ignore_errors: true

    - name: 9. Laporan Konfirmasi Status Client Docker
      ansible.builtin.debug:
        msg:
          - "🐳 Container: {{ docker_client_status.stdout }}"
          - "📄 Log Container:"
          - "{{ docker_client_log.stdout_lines }}"
